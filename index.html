<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Training Hub</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="kettles.css">
</head>
<body>

<div id="tabs">
  <button class="tab-btn active" data-page="page-symbol-trainer">Symbol Trainer</button>
  <button class="tab-btn" data-page="page-kettles">Kettles Puzzle</button>
</div>

<div id="page-symbol-trainer" class="page active">

  <div id="streak">Current Streak: <span id="streak-count">0</span></div>

  <div id="set-switcher"></div>

  <div id="image-container">
    <img id="symbol" src="" alt="symbol">
  </div>

  <div id="buttons"></div>

  <div id="reroll-container"></div>

</div>

<div id="page-kettles" class="page">

  <div id="player-toggle">
    <button class="player-btn active" data-player="1">Player 1</button>
    <button class="player-btn" data-player="2">Player 2</button>
  </div>

  <div id="kettles-container"></div>

  <button id="kettles-shuffle">Shuffle Pattern</button>

  <div id="kettles-move-title">Move the kettles below to match the pattern above</div>

  <div id="kettles-move-container"></div>

  <div id="kettles-status">0 / 12 correct</div>

  <button id="kettles-reset">Reset Kettles</button>

</div>

<script src="tabs.js"></script>
<script src="script.js"></script>
<script src="kettles.js"></script>

</body>
</html>
